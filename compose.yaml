services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: snaptext
      POSTGRES_USER: snaptext
      POSTGRES_PASSWORD: snaptext
    ports:
      - "5432:5432"
    volumes:
      - snaptext_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snaptext -d snaptext"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  snaptext_postgres_data:
