name: OCR PaddleOCR Benchmark

on:
  workflow_dispatch:
    inputs:
      passes:
        description: "Measured passes per fixture (warm-up is additional)"
        required: true
        default: "3"
        type: choice
        options: ["1", "3", "5"]

permissions:
  contents: read

concurrency:
  group: snaptext-paddleocr-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paddleocr:
    name: Run PaddleOCR on shared synthetic fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.14"
          cache: pip
          cache-dependency-path: scripts/ocr-benchmark/requirements-rasterize.txt
      - name: Install rasterization and PaddleOCR dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement scripts/ocr-benchmark/requirements-rasterize.txt
          python -m pip install "paddlepaddle==2.6.2" "paddleocr==2.7.3"
      - name: Rasterize deterministic fixtures
        run: python scripts/ocr-benchmark/rasterize.py
      - name: Verify PaddleOCR runtime
        run: python -c "import paddle; import paddleocr; print('PaddlePaddle', paddle.__version__); print('PaddleOCR import OK')"
      - name: Run real PaddleOCR benchmark
        run: |
          node scripts/ocr-benchmark/benchmark-runner.mjs --engine paddleocr --manifest artifacts/ocr-benchmark/raster-manifest.json --passes "${{ inputs.passes }}" --output artifacts/ocr-benchmark/predictions-paddleocr.json --raw-output artifacts/ocr-benchmark/runs-paddleocr.json
          node scripts/ocr-benchmark/extract-fields.mjs --manifest scripts/ocr-benchmark/manifest.example.json --predictions artifacts/ocr-benchmark/predictions-paddleocr.json --output artifacts/ocr-benchmark/predictions-paddleocr-fields.json
          node scripts/ocr-benchmark/score.mjs scripts/ocr-benchmark/manifest.example.json artifacts/ocr-benchmark/predictions-paddleocr-fields.json > artifacts/ocr-benchmark/score-paddleocr.json
      - name: Upload PaddleOCR benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-benchmark-paddleocr-results
          path: artifacts/ocr-benchmark/
          if-no-files-found: warn
          retention-days: 14
