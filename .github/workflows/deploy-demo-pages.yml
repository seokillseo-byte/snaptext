name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [feature/ocr-benchmark-foundation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: snaptext-demo-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static demo preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app for the repository Pages path
        run: npm --workspace @snaptext/web run build
        env:
          VITE_BASE_PATH: /snaptext/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    name: Publish demo preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
