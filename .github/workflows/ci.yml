name: SnapText CI

on:
  push:
    branches: [main, "foundation/**", "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and pull_request both fire for PR branches; keep their runs separate so a queued PR run cannot cancel the push run (or vice versa).
  group: snaptext-ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, migrate, test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: snaptext
          POSTGRES_USER: snaptext
          POSTGRES_PASSWORD: snaptext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snaptext -d snaptext"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://snaptext:snaptext@localhost:5432/snaptext
      STORAGE_ROOT: .snaptext-data/images
      UPLOAD_TEMP_ROOT: .snaptext-data/tmp
      UPLOAD_MAX_FILES: 20
      UPLOAD_MAX_FILE_SIZE_MB: 10
      UPLOAD_MAX_TOTAL_SIZE_MB: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python for deterministic fixture rasterization
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: scripts/ocr-benchmark/requirements-rasterize.txt
      - name: Install dependencies
        run: npm ci
      - name: Install pinned rasterization dependencies
        run: python -m pip install --requirement scripts/ocr-benchmark/requirements-rasterize.txt
      - name: Apply database migrations
        run: npm run db:migrate && npm run db:migrate
      - name: Run API tests
        run: npm test
      - name: Run OCR benchmark scorer, adapters, extraction, and repeated-run tests
        run: node --test scripts/ocr-benchmark/score.test.mjs scripts/ocr-benchmark/score-cli.test.mjs scripts/ocr-benchmark/engine-adapters.test.mjs scripts/ocr-benchmark/extract-fields.test.mjs scripts/ocr-benchmark/benchmark-runner.test.mjs scripts/ocr-benchmark/compare-reports.test.mjs scripts/ocr-benchmark/render-report.test.mjs
      - name: Validate OCR benchmark fixtures
        run: node --test scripts/ocr-benchmark/validate-manifest.test.mjs && node scripts/ocr-benchmark/validate-manifest.mjs
      - name: Rasterize OCR fixtures and record hashes
        run: python scripts/ocr-benchmark/rasterize.py
      - name: Upload rasterized fixtures and provenance
        uses: actions/upload-artifact@v4
        with:
          name: ocr-benchmark-rasterized-fixtures
          path: artifacts/ocr-benchmark/
          if-no-files-found: error
          retention-days: 14
      - name: Install Tesseract and English/Vietnamese language data
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie
          tesseract --version
          tesseract --list-langs
      - name: Run real Tesseract benchmark on rasterized fixtures
        run: |
          node scripts/ocr-benchmark/benchmark-runner.mjs --engine tesseract --manifest artifacts/ocr-benchmark/raster-manifest.json --passes 3 --output artifacts/ocr-benchmark/predictions-tesseract.json --raw-output artifacts/ocr-benchmark/runs-tesseract.json
          node scripts/ocr-benchmark/extract-fields.mjs --manifest scripts/ocr-benchmark/manifest.example.json --predictions artifacts/ocr-benchmark/predictions-tesseract.json --output artifacts/ocr-benchmark/predictions-tesseract-fields.json
          node scripts/ocr-benchmark/score.mjs scripts/ocr-benchmark/manifest.example.json artifacts/ocr-benchmark/predictions-tesseract-fields.json > artifacts/ocr-benchmark/score-tesseract.json
          node scripts/ocr-benchmark/render-report.mjs --input artifacts/ocr-benchmark/score-tesseract.json --output artifacts/ocr-benchmark/tesseract-report.html --title "SnapText · Tesseract Benchmark"
      - name: Upload real OCR benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-benchmark-tesseract-results
          path: artifacts/ocr-benchmark/
          if-no-files-found: warn
          retention-days: 14
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
